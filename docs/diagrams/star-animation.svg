<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d4a8a"/>
    </marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Figure 4b: Star Animation FSM (SAN) — piano_display2.sv</text>
  <text x="410" y="42" text-anchor="middle" font-size="10" fill="#555">Tick rate: ~8 Hz (frame_cnt counter) | Q0.8 fixed-point inverse rotation</text>

  <!-- ===== 8 States arranged in a circle ===== -->
  <!-- Center: 410, 270; radius ~175 -->
  <!-- Angles: 0°=right, 45°=bottom-right, etc. -->
  <!-- S0: top -->
  <ellipse cx="410" cy="95" rx="68" ry="28" fill="#dce6f7" stroke="#2d4a8a" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a5e">SAN_IDLE</text>
  <text x="410" y="104" text-anchor="middle" font-size="9" fill="#1a2a5e">S0 | Stars hidden</text>

  <!-- S1: top-right -->
  <ellipse cx="620" cy="150" rx="68" ry="28" fill="#e2efda" stroke="#5a9e52" stroke-width="2"/>
  <text x="620" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a17">SAN_SPAWN</text>
  <text x="620" y="159" text-anchor="middle" font-size="9" fill="#1a3a17">S1 | Init positions</text>

  <!-- S2: right -->
  <ellipse cx="710" cy="280" rx="68" ry="28" fill="#fff2cc" stroke="#d6a800" stroke-width="2"/>
  <text x="710" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d5a00">SAN_EXPAND</text>
  <text x="710" y="289" text-anchor="middle" font-size="9" fill="#7d5a00">S2 | Radius ↑</text>

  <!-- S3: bottom-right -->
  <ellipse cx="620" cy="410" rx="68" ry="28" fill="#fff2cc" stroke="#d6a800" stroke-width="2"/>
  <text x="620" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d5a00">SAN_ROTATE</text>
  <text x="620" y="419" text-anchor="middle" font-size="9" fill="#7d5a00">S3 | Orbit rotation</text>

  <!-- S4: bottom -->
  <ellipse cx="410" cy="455" rx="68" ry="28" fill="#dce6f7" stroke="#2d4a8a" stroke-width="2"/>
  <text x="410" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a5e">SAN_HOLD</text>
  <text x="410" y="464" text-anchor="middle" font-size="9" fill="#1a2a5e">S4 | Hold display</text>

  <!-- S5: bottom-left -->
  <ellipse cx="200" cy="410" rx="68" ry="28" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="200" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">SAN_CONTRACT</text>
  <text x="200" y="419" text-anchor="middle" font-size="9" fill="#c62828">S5 | Radius ↓</text>

  <!-- S6: left -->
  <ellipse cx="110" cy="280" rx="68" ry="28" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="110" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">SAN_SCATTER</text>
  <text x="110" y="289" text-anchor="middle" font-size="9" fill="#c62828">S6 | Random drift</text>

  <!-- S7: top-left -->
  <ellipse cx="200" cy="150" rx="68" ry="28" fill="#dce6f7" stroke="#2d4a8a" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a5e">SAN_RESET</text>
  <text x="200" y="159" text-anchor="middle" font-size="9" fill="#1a2a5e">S7 | Clear & return</text>

  <!-- ===== Transitions (clockwise ring) ===== -->
  <!-- S0 → S1 -->
  <path d="M 476,108 Q 548,108 554,138" stroke="#2d4a8a" stroke-width="1.5" fill="none" marker-end="url(#arr_blue)"/>
  <text x="530" y="106" font-size="9" fill="#2d4a8a">win trigger</text>

  <!-- S1 → S2 -->
  <path d="M 668,170 Q 710,200 710,252" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="712" y="218" font-size="9" fill="#444">tick</text>

  <!-- S2 → S3 -->
  <path d="M 710,308 Q 710,370 668,396" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="720" y="355" font-size="9" fill="#444">r_max</text>

  <!-- S3 → S4 -->
  <path d="M 554,420 Q 480,436 476,446" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="504" y="448" font-size="9" fill="#444">angle=360°</text>

  <!-- S4 → S5 -->
  <path d="M 344,458 Q 268,458 264,424" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="292" y="472" font-size="9" fill="#444">hold_done</text>

  <!-- S5 → S6 -->
  <path d="M 152,394 Q 110,362 110,308" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="96" y="356" font-size="9" fill="#444">r=0</text>

  <!-- S6 → S7 -->
  <path d="M 110,252 Q 110,192 136,166" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="86" y="216" font-size="9" fill="#444">drift_done</text>

  <!-- S7 → S0 -->
  <path d="M 264,138 Q 340,100 344,100" stroke="#2d4a8a" stroke-width="1.5" fill="none" marker-end="url(#arr_blue)"/>
  <text x="300" y="118" font-size="9" fill="#2d4a8a">done</text>

  <!-- S0 self-loop (idle) -->
  <path d="M 410,67 Q 410,38 440,50 Q 480,60 478,88" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,2"/>
  <text x="462" y="44" font-size="9" fill="#555">no trigger</text>

  <!-- S4 self-loop (hold) -->
  <path d="M 410,483 Q 410,500 440,495 Q 465,488 463,467" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,2"/>
  <text x="452" y="504" font-size="9" fill="#555">hold_cnt</text>

  <!-- ===== Center label ===== -->
  <text x="410" y="265" text-anchor="middle" font-size="11" fill="#999">~8 Hz tick</text>
  <text x="410" y="282" text-anchor="middle" font-size="11" fill="#999">Q0.8 fixed-pt</text>
  <text x="410" y="299" text-anchor="middle" font-size="11" fill="#999">rotation</text>

  <!-- ===== Details box ===== -->
  <rect x="300" y="300" width="220" height="95" rx="6" fill="#f0f4ff" stroke="#2d4a8a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="410" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a2a5e">Key Implementation</text>
  <text x="310" y="334" font-size="9" fill="#333">• Coordinates: Q8.0 fixed-point</text>
  <text x="310" y="348" font-size="9" fill="#333">• Rotation: inv-rot matrix (Q0.8)</text>
  <text x="310" y="362" font-size="9" fill="#333">• 8 stars per animation burst</text>
  <text x="310" y="376" font-size="9" fill="#333">• Triggered by: GS_WIN signal</text>
  <text x="310" y="390" font-size="9" fill="#333">• Clock domain: clk_25MHz</text>
</svg>

<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <marker id="arr_red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
    <marker id="arr_grn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d6a27"/>
    </marker>
  </defs>

  <text x="430" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Figure 4a: Game State Machine (piano_display2.sv)</text>

  <!-- ===== States ===== -->
  <!-- GS_MANUAL (0) -->
  <ellipse cx="120" cy="120" rx="72" ry="30" fill="#e2efda" stroke="#5a9e52" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a17">GS_MANUAL</text>
  <text x="120" y="130" text-anchor="middle" font-size="9" fill="#1a3a17">state=0 | Free play mode</text>

  <!-- GS_SELECT (1) -->
  <ellipse cx="360" cy="120" rx="72" ry="30" fill="#dce6f7" stroke="#2d4a8a" stroke-width="2"/>
  <text x="360" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2a5e">GS_SELECT</text>
  <text x="360" y="130" text-anchor="middle" font-size="9" fill="#1a2a5e">state=1 | Song selection</text>

  <!-- GS_COUNTDOWN (2) -->
  <ellipse cx="600" cy="120" rx="72" ry="30" fill="#fff2cc" stroke="#d6a800" stroke-width="2"/>
  <text x="600" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d5a00">GS_COUNTDOWN</text>
  <text x="600" y="130" text-anchor="middle" font-size="9" fill="#7d5a00">state=2 | 3-2-1 timer</text>

  <!-- GS_PLAYING (3) -->
  <ellipse cx="600" cy="260" rx="72" ry="30" fill="#e2efda" stroke="#5a9e52" stroke-width="2.5"/>
  <text x="600" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a17">GS_PLAYING</text>
  <text x="600" y="270" text-anchor="middle" font-size="9" fill="#1a3a17">state=3 | Active game</text>

  <!-- GS_PAUSED (4) -->
  <ellipse cx="360" cy="260" rx="72" ry="30" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">GS_PAUSED</text>
  <text x="360" y="270" text-anchor="middle" font-size="9" fill="#c62828">state=4 | Paused</text>

  <!-- GS_WIN (5) -->
  <ellipse cx="120" cy="380" rx="72" ry="30" fill="#e2efda" stroke="#5a9e52" stroke-width="2.5"/>
  <text x="120" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a17">GS_WIN</text>
  <text x="120" y="390" text-anchor="middle" font-size="9" fill="#1a3a17">state=5 | Win overlay</text>

  <!-- GS_LOSE (7) -->
  <ellipse cx="600" cy="380" rx="72" ry="30" fill="#fce4ec" stroke="#c62828" stroke-width="2.5"/>
  <text x="600" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">GS_LOSE</text>
  <text x="600" y="390" text-anchor="middle" font-size="9" fill="#c62828">state=7 | Lose overlay</text>

  <!-- GS_RESULT (6) -->
  <ellipse cx="360" cy="380" rx="72" ry="30" fill="#fff2cc" stroke="#d6a800" stroke-width="2"/>
  <text x="360" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#7d5a00">GS_RESULT</text>
  <text x="360" y="390" text-anchor="middle" font-size="9" fill="#7d5a00">state=6 | Score result</text>

  <!-- ===== Transitions ===== -->
  <!-- MANUAL → SELECT: Tab key -->
  <line x1="192" y1="120" x2="288" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="240" y="113" text-anchor="middle" font-size="9" fill="#444">Tab pressed</text>

  <!-- SELECT → MANUAL: Tab again -->
  <path d="M 300,132 Q 240,160 180,132" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="240" y="158" text-anchor="middle" font-size="9" fill="#444">Tab (exit game)</text>

  <!-- SELECT → COUNTDOWN: CapsLock/Enter -->
  <line x1="432" y1="120" x2="528" y2="120" stroke="#2d6a27" stroke-width="1.5" marker-end="url(#arr_grn)"/>
  <text x="480" y="113" text-anchor="middle" font-size="9" fill="#2d6a27">CapsLock/Enter</text>

  <!-- COUNTDOWN → PLAYING -->
  <line x1="600" y1="150" x2="600" y2="230" stroke="#2d6a27" stroke-width="1.5" marker-end="url(#arr_grn)"/>
  <text x="618" y="195" font-size="9" fill="#2d6a27">count=0</text>

  <!-- PLAYING → PAUSED: Tab -->
  <line x1="528" y1="260" x2="432" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="253" text-anchor="middle" font-size="9" fill="#444">Tab (pause)</text>

  <!-- PAUSED → PLAYING: Tab -->
  <path d="M 432,272 Q 480,296 528,272" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="480" y="294" text-anchor="middle" font-size="9" fill="#444">Tab (resume)</text>

  <!-- PLAYING → WIN -->
  <path d="M 538,278 Q 360,340 192,378" stroke="#2d6a27" stroke-width="1.5" fill="none" marker-end="url(#arr_grn)"/>
  <text x="340" y="316" text-anchor="middle" font-size="9" fill="#2d6a27">all notes hit</text>

  <!-- PLAYING → LOSE -->
  <line x1="600" y1="290" x2="600" y2="350" stroke="#c62828" stroke-width="1.5" marker-end="url(#arr_red)"/>
  <text x="622" y="325" font-size="9" fill="#c62828">miss limit</text>

  <!-- WIN → RESULT -->
  <line x1="192" y1="380" x2="288" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="240" y="373" text-anchor="middle" font-size="9" fill="#444">auto</text>

  <!-- LOSE → RESULT -->
  <line x1="528" y1="380" x2="432" y2="380" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="373" text-anchor="middle" font-size="9" fill="#444">auto</text>

  <!-- RESULT → SELECT -->
  <path d="M 360,350 L 360,260 L 360,150" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="330" y="180" font-size="9" fill="#444">Enter /</text>
  <text x="330" y="192" font-size="9" fill="#444">CapsLock</text>

  <!-- PAUSED → SELECT (quit) -->
  <path d="M 310,248 Q 270,180 308,138" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#arr_red)" stroke-dasharray="4,3"/>
  <text x="260" y="195" font-size="9" fill="#c62828">Tab (quit)</text>

  <!-- COUNTDOWN → SELECT (escape) -->
  <path d="M 560,102 Q 480,60 400,102" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#arr_red)" stroke-dasharray="4,3"/>
  <text x="480" y="56" text-anchor="middle" font-size="9" fill="#c62828">Tab (cancel)</text>

  <!-- ===== Encoding box ===== -->
  <rect x="720" y="80" width="130" height="175" rx="6" fill="#f8f8f8" stroke="#999" stroke-width="1"/>
  <text x="785" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">State Encoding</text>
  <text x="728" y="114" font-size="9" fill="#333">0 — GS_MANUAL</text>
  <text x="728" y="128" font-size="9" fill="#333">1 — GS_SELECT</text>
  <text x="728" y="142" font-size="9" fill="#333">2 — GS_COUNTDOWN</text>
  <text x="728" y="156" font-size="9" fill="#333">3 — GS_PLAYING</text>
  <text x="728" y="170" font-size="9" fill="#333">4 — GS_PAUSED</text>
  <text x="728" y="184" font-size="9" fill="#333">5 — GS_WIN</text>
  <text x="728" y="198" font-size="9" fill="#333">6 — GS_RESULT</text>
  <text x="728" y="212" font-size="9" fill="#333">7 — GS_LOSE</text>
  <text x="728" y="232" font-size="9" fill="#555">(3-bit state reg)</text>
  <text x="728" y="246" font-size="9" fill="#555">MicroBlaze writes</text>
  <text x="728" y="258" font-size="9" fill="#555">via AXI GPIO</text>

  <!-- Legend -->
  <rect x="10" y="460" width="600" height="50" rx="5" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="480" x2="50" y2="480" stroke="#2d6a27" stroke-width="2"/>
  <text x="56" y="484" font-size="10" fill="#333">Progression / success transition</text>
  <line x1="220" y1="480" x2="250" y2="480" stroke="#c62828" stroke-width="2"/>
  <text x="256" y="484" font-size="10" fill="#333">Failure / cancel transition</text>
  <line x1="420" y1="480" x2="450" y2="480" stroke="#444" stroke-width="2"/>
  <text x="456" y="484" font-size="10" fill="#333">Neutral transition</text>
  <line x1="20" y1="500" x2="50" y2="500" stroke="#444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="56" y="504" font-size="10" fill="#333">Conditional / loop-back</text>
</svg>
